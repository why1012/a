<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 서술형 피드백</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 30px;
      max-width: 550px;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h2 {
      margin-top: 0;
      color: #1e293b;
      font-size: 1.5rem;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #334155;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, textarea:focus {
      border-color: #3b82f6;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    #result {
      margin-top: 25px;
      padding: 16px;
      background-color: #f1f5f9;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #334155;
      min-height: 40px;
      white-space: pre-wrap;
    }
    .error {
      color: #ef4444;
      background-color: #fef2f2 !important;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🤖 AI 서술형 피드백</h2>
  
  <div class="form-group">
    <label for="name">이름 (학번)</label>
    <input type="text" id="name" placeholder="예: 1학년 3반 홍길동">
  </div>
  
  <div class="form-group">
    <label for="answer">학생 서술형 답변</label>
    <textarea id="answer" rows="4" placeholder="문제를 풀고 생각한 풀이 과정을 적어보세요."></textarea>
  </div>
  
  <button id="submit-btn" onclick="sendToAi()">AI 피드백 받기</button>
  
  <div id="result">여기에 AI 피드백이 표시됩니다.</div>
</div>

<script>
  // 배포된 구글 앱스 스크립트 중계 URL
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyodNr2wzZErPvBdo-DwEmwN58doHW_5RgSGDqKmaupJM5Gj_Cvu9mQq_b7t3ynbYpYRw/exec";

  async function sendToAi() {
    const nameInput = document.getElementById("name");
    const answerInput = document.getElementById("answer");
    const resultDiv = document.getElementById("result");
    const submitBtn = document.getElementById("submit-btn");

    const name = nameInput.value.trim() || "익명";
    const answer = answerInput.value.trim();

    if (!answer) {
      alert("답변 내용을 입력해 주세요.");
      return;
    }

    // UI 상태 업데이트
    submitBtn.disabled = true;
    resultDiv.classList.remove("error");
    resultDiv.innerText = "⏳ AI 선생님이 답변을 확인하고 피드백을 작성 중입니다...";

    try {
      const response = await fetch(GAS_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({ name: name, answer: answer }),
        redirect: "follow"
      });

      const data = await response.json();

      if (data.status === "success") {
        resultDiv.innerText = data.feedback;
      } else {
        resultDiv.classList.add("error");
        resultDiv.innerText = "⚠️ 오류 발생: " + data.message;
      }
    } catch (err) {
      resultDiv.classList.add("error");
      resultDiv.innerText = "⚠️ 통신 실패: " + err.message + "\n(구글 앱스 스크립트 배포 시 '액세스 권한: 모든 사용자' 여부를 확인하세요)";
    } finally {
      submitBtn.disabled = false;
    }
  }
</script>

</body>
</html>
