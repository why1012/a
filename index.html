<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>AI 피드백 테스트</title>
</head>
<body style="font-family: sans-serif; padding: 30px; max-width: 500px; margin: auto;">
  <h2>🤖 AI 서술형 피드백 테스트</h2>
  
  <p><b>이름</b></p>
  <input type="text" id="name" value="1학년 3반 홍길동" style="width: 100%; padding: 8px; margin-bottom: 10px;">
  
  <p><b>학생 서술형 답변</b></p>
  <textarea id="answer" rows="4" style="width: 100%; padding: 8px;">삼각형의 세 각을 다 더하면 180도가 됩니다.</textarea>
  
  <button onclick="sendToAi()" style="width: 100%; padding: 12px; margin-top: 10px; background-color: #4285f4; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
    AI 피드백 받기
  </button>
  
  <div id="result" style="margin-top: 20px; padding: 15px; background-color: #f1f3f4; border-radius: 5px; line-height: 1.6;">
    결과가 여기에 표시됩니다.
  </div>

  <script>
    // ⭐️ 여기에 복사하신 중계 URL을 넣으세요!
    const GAS_URL = "https://script.google.com/macros/s/AKfycb.../exec";

    async function sendToAi() {
      const name = document.getElementById("name").value;
      const answer = document.getElementById("answer").value;
      const resultDiv = document.getElementById("result");

      resultDiv.innerText = "⏳ AI 선생님이 답변을 확인하고 있습니다...";

      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ name: name, answer: answer })
        });

        const data = await response.json();

        if (data.status === "success") {
          resultDiv.innerHTML = "<b>[AI 피드백]</b><br>" + data.feedback.replace(/\n/g, "<br>");
        } else {
          resultDiv.innerText = "⚠️ 오류 발생: " + data.message;
        }
      } catch (err) {
        resultDiv.innerText = "⚠️ 통신 실패: " + err.message;
      }
    }
  </script>
</body>
</html>
