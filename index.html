<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚪 몬티 홀의 마법의 문</title>
    <style>
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            text-align: center;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }
        h1 { color: #2c3e50; }
        #message {
            font-size: 1.3rem;
            font-weight: bold;
            margin: 20px;
            color: #e74c3c;
            min-height: 2em;
            white-space: pre-line;
        }
        .door-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px auto;
            max-width: 500px;
        }
        .door {
            width: 120px;
            height: 180px;
            background-color: #8b4513;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: white;
            border: 4px solid #5c2e0e;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .door:hover {
            transform: translateY(-10px);
        }
        .door.open {
            background-color: #fff;
            cursor: default;
            transform: none;
            border-color: #bdc3c7;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        button {
            padding: 12px 24px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }
        button:hover { background-color: #2980b9; }
        .stats-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        .stat-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 250px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 5px solid #34495e;
        }
        .stat-box.stay { border-top-color: #f39c12; }
        .stat-box.switch { border-top-color: #2ecc71; }
        .stat-box h3 { margin-top: 0; font-size: 1.2rem; }
        .stat-box p { font-size: 1.1rem; margin: 10px 0; }
        .highlight { font-size: 1.5rem; color: #e74c3c; }
    </style>
</head>
<body>

    <h1>🚪 몬티 홀의 마법의 문 🐐</h1>
    <div id="message">3개의 문 중 하나를 선택하세요!<br>(1개는 🎁 최신형 스마트폰, 2개는 🐐 염소)</div>
    
    <div class="door-container">
        <div class="door" id="door0" onclick="handleDoorClick(0)">1</div>
        <div class="door" id="door1" onclick="handleDoorClick(1)">2</div>
        <div class="door" id="door2" onclick="handleDoorClick(2)">3</div>
    </div>
    
    <button id="resetBtn" onclick="initGame()">다음 게임 하기 🔄</button>

    <div class="stats-container">
        <div class="stat-box stay">
            <h3>선택을 ✊유지했을 때</h3>
            <p>시도 횟수: <span id="stayTotal">0</span>번</p>
            <p>당첨 횟수: <span id="stayWins">0</span>번</p>
            <p>당첨 확률: <strong class="highlight" id="stayRate">0%</strong></p>
        </div>
        <div class="stat-box switch">
            <h3>선택을 ✋바꾸었을 때</h3>
            <p>시도 횟수: <span id="switchTotal">0</span>번</p>
            <p>당첨 횟수: <span id="switchWins">0</span>번</p>
            <p>당첨 확률: <strong class="highlight" id="switchRate">0%</strong></p>
        </div>
    </div>

    <script>
        let prizeDoor;
        let selectedDoor = -1;
        let openedDoor = -1;
        let gameState = 0; // 0: 처음 선택 대기, 1: 변경 여부 대기, 2: 게임 종료

        let stats = {
            stay: { total: 0, wins: 0 },
            switch: { total: 0, wins: 0 }
        };

        function initGame() {
            prizeDoor = Math.floor(Math.random() * 3); // 0, 1, 2 중 랜덤으로 상품 배치
            selectedDoor = -1;
            openedDoor = -1;
            gameState = 0;

            for(let i=0; i<3; i++) {
                let door = document.getElementById('door'+i);
                door.className = 'door';
                door.innerHTML = (i+1) + ''; // 문 번호 표시
                door.style.border = "4px solid #5c2e0e";
            }
            document.getElementById('message').innerHTML = "3개의 문 중 하나를 선택하세요!<br>(1개는 🎁 최신형 스마트폰, 2개는 🐐 염소)";
            document.getElementById('resetBtn').style.display = 'none';
        }

        function handleDoorClick(index) {
            // [상태 0] 처음에 문을 고를 때
            if (gameState === 0) {
                selectedDoor = index;
                document.getElementById('door'+index).style.border = "5px solid gold"; // 선택한 문 강조
                
                // 진행자가 열어줄 염소 문 찾기 (내가 고른 문 X, 상품 있는 문 X)
                let availableToOpen = [0, 1, 2].filter(d => d !== selectedDoor && d !== prizeDoor);
                openedDoor = availableToOpen[Math.floor(Math.random() * availableToOpen.length)];
                
                let doorOpened = document.getElementById('door'+openedDoor);
                doorOpened.className = 'door open';
                doorOpened.innerHTML = '🐐';

                document.getElementById('message').innerHTML = `${openedDoor+1}번 문을 열었습니다! 염소가 있네요.<br>선택을 바꾸시겠습니까? (선택한 문: 유지 / 다른 문: 변경)`;
                gameState = 1;
            } 
            // [상태 1] 진행자가 문을 연 후 최종 선택을 할 때
            else if (gameState === 1) {
                if (index === openedDoor) return; // 이미 열린 문은 클릭 불가

                let finalPick = index;
                let isSwitch = (finalPick !== selectedDoor);
                let isWin = (finalPick === prizeDoor);

                // 통계 업데이트
                if (isSwitch) {
                    stats.switch.total++;
                    if (isWin) stats.switch.wins++;
                } else {
                    stats.stay.total++;
                    if (isWin) stats.stay.wins++;
                }

                // 모든 문 결과 공개
                for(let i=0; i<3; i++) {
                    let door = document.getElementById('door'+i);
                    door.className = 'door open';
                    if(i === prizeDoor) {
                        door.innerHTML = '🎁';
                    } else {
                        door.innerHTML = '🐐';
                    }
                }

                // 결과 테두리 표시 (당첨은 파란색, 꽝은 빨간색)
                document.getElementById('door'+finalPick).style.border = "5px solid " + (isWin ? "#3498db" : "#e74c3c");

                document.getElementById('message').innerHTML = isWin ? "축하합니다! 🎁스마트폰을 획득했습니다!🎉" : "아쉽네요. 🐐염소 당첨입니다!";
                document.getElementById('resetBtn').style.display = 'inline-block';
                
                updateStatsDisplay();
                gameState = 2; // 게임 종료 상태
            }
        }

        function updateStatsDisplay() {
            document.getElementById('stayTotal').innerText = stats.stay.total;
            document.getElementById('stayWins').innerText = stats.stay.wins;
            document.getElementById('stayRate').innerText = stats.stay.total > 0 ? Math.round((stats.stay.wins / stats.stay.total) * 100) + '%' : '0%';

            document.getElementById('switchTotal').innerText = stats.switch.total;
            document.getElementById('switchWins').innerText = stats.switch.wins;
            document.getElementById('switchRate').innerText = stats.switch.total > 0 ? Math.round((stats.switch.wins / stats.switch.total) * 100) + '%' : '0%';
        }

        // 초기화 함수 실행
        initGame();
    </script>
</body>
</html>
